<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4b6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yezh">
  <title>Yezh</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="brand">Yezh</p>
        <p class="brand-sub" id="brand-sub">langue, en breton</p>
      </div>
      <p class="clock" id="clock" hidden>5 min</p>
    </header>
    <div class="gauge" id="gauge" hidden role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0" aria-label="Séance">
      <span id="gauge-fill"></span>
    </div>

    <div class="scene" id="scene">
      <div class="figure-wrap" id="figure-wrap" hidden>
        <img class="figure" id="portrait" alt="">
      </div>
      <div class="lesson-col">
        <section class="coach" id="coach" hidden>
          <div class="coach-copy">
            <p class="who" id="who"></p>
            <p class="role" id="role"></p>
            <p class="line" id="line"></p>
          </div>
        </section>
        <p class="step" id="step" aria-live="polite"></p>
        <section class="stage" id="stage"></section>
        <div class="actions" id="actions"></div>
      </div>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
